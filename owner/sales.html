<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Sales - Vogue Harbor</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/owner.css">
</head>
<body>
    <nav class="owner-nav">
        <div class="nav-brand">Vogue Harbor <span>Owner</span></div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="sales.html" class="active">Sales</a>
            <a href="reports.html">Reports</a>
        </div>
        <button id="logout-btn">Logout</button>
    </nav>

    <main class="dashboard-main">
        <h1>Record a Sale</h1>

        <div class="form-panel">
            <form id="sale-form">
                <label>Product</label>
                <select id="s-product" required></select>
                <p id="stock-hint" class="muted"></p>

                <div class="form-row">
                    <div>
                        <label>Quantity</label>
                        <input type="number" id="s-quantity" min="1" value="1" required>
                    </div>
                    <div>
                        <label>Payment Method</label>
                        <select id="s-payment">
                            <option value="CASH">Cash</option>
                            <option value="CARD">Card</option>
                            <option value="UPI">UPI</option>
                        </select>
                    </div>
                </div>

                <label>Customer Name (optional)</label>
                <input type="text" id="s-customer-name">

                <label>Customer Phone (optional)</label>
                <input type="text" id="s-customer-phone">

                <div class="form-actions">
                    <button type="submit" class="primary-btn">Record Sale</button>
                </div>
                <div id="sale-error" class="error-box" style="display: none;"></div>
                <div id="sale-success" class="success-box" style="display: none;"></div>
            </form>
        </div>

        <h2>Recent Sales</h2>
        <table class="data-table" id="sales-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Selling Price</th>
                    <th>Profit</th>
                    <th>Payment</th>
                    <th>Customer</th>
                </tr>
            </thead>
            <tbody id="sales-tbody">
                <tr><td colspan="7">Loading...</td></tr>
            </tbody>
        </table>
    </main>

    <script type="module" src="../js/pages/sales.js"></script>
</body>
</html>
