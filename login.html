<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vogue Harbor</title>
    <link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
    <div class="auth-container">
        <h1>Vogue Harbor</h1>

        <div class="role-toggle">
            <button type="button" class="role-btn active" data-role="CUSTOMER">Customer</button>
            <button type="button" class="role-btn" data-role="OWNER">Admin</button>
        </div>

        <h2 id="portal-label">Customer Login</h2>

        <form id="login-form">
            <input type="hidden" id="selected-role" value="CUSTOMER">

            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <div id="error-box" class="error-box" style="display: none;"></div>

            <button type="submit">Login</button>
        </form>

        <p id="signup-hint">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
