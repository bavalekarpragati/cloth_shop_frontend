<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vogue Harbor - Cloth Collection</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/customer.css">
    <link rel="stylesheet" href="assets/css/storefront.css">
</head>
<body>
    <nav class="customer-nav">
        <div class="nav-brand"><a href="index.html" style="color:inherit; text-decoration:none;">Vogue Harbor</a></div>
        <div id="nav-auth"></div>
    </nav>

    <!-- Horizontal category bar + subcategory chips -->
    <div class="sf-catbar">
        <div class="sf-tabs" id="category-tabs"></div>
    </div>
    <div class="sf-subrows" id="subcategory-rows"></div>

    <main class="sf-main">
        <section class="sf-hero" id="hero">
            <p class="sf-eyebrow">New season</p>
            <h1>Styles for every occasion</h1>
            <p>Sarees, kurtis, western wear and kidswear, all in one place.</p>
        </section>

        <div class="sf-toolbar">
            <input type="text" id="f-search" placeholder="Search saree, kurti, jeans...">
            <select id="f-ordering">
                <option value="-created_at">Newest</option>
                <option value="selling_price">Price: Low to High</option>
                <option value="-selling_price">Price: High to Low</option>
            </select>
            <button id="clear-filters" class="sf-ghost-btn">Clear</button>
        </div>

        <div class="sf-viewhead" id="view-head" hidden>
            <h2 id="view-title"></h2>
            <p id="results-count" class="sf-muted"></p>
        </div>

        <div id="store-content"><p class="sf-muted">Loading products...</p></div>
    </main>

    <script type="module" src="js/pages/home.js"></script>
</body>
</html>
